<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-badge {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-pending { background-color: #ffc107; color: #000; }
        .status-confirmed { background-color: #17a2b8; color: #fff; }
        .status-shipped { background-color: #007bff; color: #fff; }
        .status-delivered { background-color: #28a745; color: #fff; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Admin Panel</a>
            <div class="navbar-nav ms-auto">
                 <a class="nav-link" href="AddProducts.html">Add Products</a>
                <a class="nav-link" href="ManageProducts.html">Manage Products</a>
                <a class="nav-link active" href="ManageOrders.html">Manage Orders</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="text-center my-4">Manage Orders</h1>
        
        <div class="row mb-3">
            <div class="col-md-3">
                <select class="form-select" id="filterStatus">
                    <option value="all">All Orders</option>
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="shipped">Shipped</option>
                    <option value="delivered">Delivered</option>
                </select>
            </div>
            <div class="col-md-3">
                <button class="btn btn-primary" onclick="loadOrders()">Refresh</button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Order ID</th>
                        <th>Date</th>
                        <th>Product</th>
                        <th>Customer</th>
                        <th>Contact</th>
                        <th>Address</th>
                        <th>Qty</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let allOrders = [];

        function loadOrders() {
            fetch("http://localhost:8080/api/orders")
                .then(res => res.json())
                .then(orders => {
                    allOrders = orders;
                    displayOrders(orders);
                })
                .catch(err => {
                    console.error("Error:", err);
                    document.getElementById("ordersTableBody").innerHTML = 
                        '<tr><td colspan="10" class="text-center text-danger">Error loading orders. Is server running?</td></tr>';
                });
        }

        function displayOrders(orders) {
            const tableBody = document.getElementById("ordersTableBody");
            tableBody.innerHTML = "";
            
            if (orders.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="10" class="text-center">No orders found.</td></tr>';
                return;
            }
            
            orders.forEach(order => {
                const orderDate = new Date(order.orderDate).toLocaleDateString();
                
                tableBody.innerHTML += `
                    <tr>
                        <td>${order.id}</td>
                        <td>${orderDate}</td>
                        <td>${order.productName}</td>
                        <td>${order.customerName}</td>
                        <td>
                            ${order.customerEmail}<br>
                            ${order.customerPhoneNo}
                        </td>
                        <td>${order.address}</td>
                        <td>${order.quantity}</td>
                        <td>₹${order.totalPrice}</td>
                        <td>
                            <span class="status-badge status-${order.status}">${order.status.toUpperCase()}</span>
                        </td>
                        <td>
                            <select class="form-select form-select-sm" onchange="updateOrderStatus(${order.id}, this.value)">
                                <option value="">Change Status</option>
                                <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                                <option value="confirmed" ${order.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                                <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                                <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                            </select>
                            <button class="btn btn-sm btn-danger mt-1" onclick="deleteOrder(${order.id})">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        function updateOrderStatus(orderId, newStatus) {
            if (!newStatus) return;
            
            fetch('http://localhost:8080/api/orders', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: orderId, status: newStatus })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(' Order status updated!');
                    loadOrders();
                } else {
                    throw new Error('Update failed');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert(' Failed to update status');
            });
        }

        function deleteOrder(orderId) {
            if (!confirm('Are you sure you want to delete this order?')) {
                return;
            }
            
            fetch('http://localhost:8080/api/orders', {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: orderId })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Order deleted successfully!');
                    loadOrders();
                } else {
                    throw new Error('Delete failed');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Failed to delete order');
            });
        }

        document.getElementById('filterStatus').addEventListener('change', function() {
            const status = this.value;
            if (status === 'all') {
                displayOrders(allOrders);
            } else {
                const filtered = allOrders.filter(order => order.status === status);
                displayOrders(filtered);
            }
        });

        loadOrders();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
