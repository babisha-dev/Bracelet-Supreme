<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Admin Panel</a>
            <div class="navbar-nav ms-auto">
                 <a class="nav-link" href="AddProducts.html">Add Products</a>
                <a class="nav-link active" href="ManageProducts.html">Manage Products</a>
                <a class="nav-link" href="ManageOrders.htm">Manage Orders</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h1 class="text-center my-4">Manage Products</h1>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="productTableBody"></tbody>
        </table>
    </div>
    
    <script>
        function loadProducts() {
            fetch("http://localhost:8080/api/products")
              .then(res => res.json())
              .then(products => {
                const tableBody = document.getElementById("productTableBody");
                tableBody.innerHTML = "";
                
                if (products.length === 0) {
                  tableBody.innerHTML = '<tr><td colspan="6" class="text-center">No products found. Add some products first!</td></tr>';
                  return;
                }
                
                products.forEach(p => {
                  tableBody.innerHTML += `
                    <tr>
                      <td>${p.id}</td>
                      <td><img src="${p.img}" width="60" height="60" style="object-fit: cover;"></td>
                      <td>${p.name}</td>
                      <td>${p.category}</td>
                      <td>₹${p.price}</td>
                      <td>
                        <button class="btn btn-sm btn-primary me-2" onclick="editProduct(${p.id})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">Delete</button>
                      </td>
                    </tr>`;
                });
              })
              .catch(err => {
                console.error("Error:", err);
                document.getElementById("productTableBody").innerHTML = 
                  '<tr><td colspan="6" class="text-center text-danger">Error loading products. Is server running?</td></tr>';
              });
        }
loadProducts();

           function editProduct(id) {
      window.location.href = `EditProduct.html?id=${id}`;
    }

        function deleteProduct(id) {
          if (confirm('Are you sure you want to delete this product?')) {
            fetch('http://localhost:8080/api/products',{
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'

                },
                body : JSON.stringify({id:id})
            })
            .then(response => {
                if(response.status===200){
                    alert("Deleted Successfully");
                    loadProducts();
                }
                else{
                    throw new Error("Failed");
                }
            } )

            .catch(error=>{
                console.error(error);
                alert("error deleting product");
            });
          }
        }
    </script>
</body>
</html>
