<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Admin Panel</a>
            <div class="navbar-nav ms-auto">
                 <a class="nav-link active" href="AddProducts.html">Add Products</a>
                <a class="nav-link" href="ManageProducts.html">Manage Products</a>
                <a class="nav-link" href="ManageOrders.htm">Manage Orders</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        
        <h1 class="text-center my-4">Add Products</h1>

        <form id="productform">
            <div class="mb-3">
                <label class="form-label" for="productName">Product Name</label>
                <input class="form-control" type="text" id="productName" placeholder="Enter the Product name" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label" for="productCategory">Category</label>
                <input class="form-control" type="text" id="productCategory" placeholder="Enter the Category" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="productPrice">Price</label>
                <input class="form-control" type="number" step="0.01" id="productPrice" placeholder="Enter the Price" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label" for="productImg">Image URL</label>
                <input class="form-control" type="url" id="productImg" placeholder="Enter image URL (e.g., https://example.com/image.jpg)" required>
               
            </div>

            <button class="btn btn-success" type="submit">Add Product</button>
            <a href="/frontend/Admin/ManageProducts.html" class="btn btn-secondary">Back to Manage</a>
        </form>
    </div> 
    
    <script>
    const form = document.getElementById("productform");

    form.addEventListener("submit", function (event) {
        event.preventDefault();

        const product = {
            name: document.getElementById("productName").value,
            category: document.getElementById("productCategory").value,
            price: parseFloat(document.getElementById("productPrice").value),  
            img: document.getElementById("productImg").value
        };

        console.log("Sending product:", product);  
        fetch("http://localhost:8080/api/products", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(product)
        })
        .then(response => {
            if (response.status === 201) {
                alert(" Product added successfully!");
                form.reset();
            } else {
                throw new Error("Failed to add product");
            }
        })
        .catch(error => {
            console.error("Error:", error);
            alert(" Error adding product! Make sure the server is running.");
        });
    });
</script>
</body>
</html>
